[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "Aqours_code"
version = "0.1.0"
description = "A local coding-agent harness with traceable execution and isolated Docker evals."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.12"
dependencies = ["anthropic>=0.34", "python-dotenv>=1.0", "pyyaml>=6.0"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
Aqours_code = "aqours_code.main:main"
[tool.setuptools.packages.find]
include = ["aqours_code*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not docker'"
markers = [
    "docker: integration tests requiring a working Docker daemon",
]
